spring.application.name=ai-company-brain

server.port=${PORT:8080}

# PostgreSQL / DataSource
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5433/companybrain}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate
spring.jpa.database=postgresql
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Spring AI
spring.ai.model.chat=openai
spring.ai.model.embedding.text=google-genai

# Google GenAI Embeddings
spring.ai.google.genai.embedding.api-key=${GOOGLE_GENAI_API_KEY:}
spring.ai.google.genai.embedding.text.model=text-embedding-004
spring.ai.google.genai.embedding.text.options.dimensions=768

# Groq Chat Model
spring.ai.openai.base-url=https://api.groq.com/openai
spring.ai.openai.api-key=${GROQ_API_KEY:}
spring.ai.openai.chat.options.model=${GROQ_CHAT_MODEL:llama-3.3-70b-versatile}

# PGVector
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.dimensions=768

# JWT
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration=86400000

spring.autoconfigure.exclude=org.springframework.ai.model.openai.autoconfigure.OpenAiEmbeddingAutoConfiguration